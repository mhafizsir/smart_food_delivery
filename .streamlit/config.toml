# Tampilan aplikasi. Warna diambil dari makanan Indonesia:
# daun pisang (hijau), kunyit (kuning) untuk HIGH, sambal (merah) untuk URGENT.
[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1E6B45"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF4EF"
textColor = "#1B2A21"
borderColor = "#D3E0D6"
dataframeHeaderBackgroundColor = "#EEF4EF"
greenColor = "#1E6B45"
yellowColor = "#E0A21B"
orangeColor = "#E0A21B"
redColor = "#C2362B"
blueColor = "#3F7A8C"
blueBackgroundColor = "#E3EEF1"
blueTextColor = "#2B5866"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
headingFontSizes = ["2.25rem", "1.5rem", "1.2rem"]
headingFontWeights = [700, 700, 600]
baseRadius = "0.5rem"
chartCategoricalColors = ["#1E6B45", "#E0A21B", "#C2362B", "#4F8A9B", "#8A6E4B"]

[theme.sidebar]
backgroundColor = "#173F2B"
secondaryBackgroundColor = "#21533A"
textColor = "#F1F6F2"
primaryColor = "#E0A21B"
borderColor = "#2C6347"
